# fly.toml app configuration for go-bot / Zero Clawd web console
# Deploy from this directory:  fly deploy
# App hostname: https://go-bot-red-coral-6526.fly.dev

app = 'go-bot-red-coral-6526'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  # Must match CMD -port and Dockerfile EXPOSE
  internal_port = 18800
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
